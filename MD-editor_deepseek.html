<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor Pro</title>

    <!-- Marked.js per il parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <!-- Highlight.js per il syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>

    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-surface: #16162a;
            --bg-surface-hover: #1e1e35;
            --bg-toolbar: #12122a;
            --bg-input: #0a0a18;
            --bg-preview: #0f0f1a;
            --bg-code: #080814;
            --bg-code-inline: #1a1a30;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a85;
            --text-preview: #d8d8e8;
            --accent: #7c5cfc;
            --accent-hover: #8f6cff;
            --accent-soft: rgba(124, 92, 252, 0.15);
            --accent-soft-hover: rgba(124, 92, 252, 0.25);
            --border: #2a2a45;
            --border-light: #32325a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============ HEADER ============ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            user-select: none;
        }

        .app-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-logo {
            width: 38px;
            height: 38px;
            background: var(--accent);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 20px rgba(124, 92, 252, 0.35);
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .app-title span {
            color: var(--accent);
        }

        .app-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stats-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-input);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .stats-badge .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .stats-badge .stat-item strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .stats-separator {
            width: 1px;
            height: 14px;
            background: var(--border);
        }

        /* ============ BUTTONS ============ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            user-select: none;
            letter-spacing: 0.2px;
        }

        .btn:hover {
            background: var(--bg-surface-hover);
            border-color: var(--border-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(124, 92, 252, 0.3);
        }

        .btn-accent:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 0 30px rgba(124, 92, 252, 0.45);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--border-light);
        }

        .btn-outline:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 15px;
            position: relative;
        }

        .btn-icon:hover {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--border-light);
        }

        .btn-icon:active {
            transform: scale(0.95);
        }

        /* Tooltip */
        .btn-icon[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2a45;
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            z-index: 100;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            pointer-events: none;
            letter-spacing: 0.3px;
        }

        /* ============ TOOLBAR ============ */
        .toolbar-container {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 8px 20px;
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            user-select: none;
            transition: all var(--transition);
        }

        .toolbar-container::-webkit-scrollbar {
            height: 4px;
        }
        .toolbar-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .toolbar-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 6px;
        }

        .toolbar-divider {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 6px;
            flex-shrink: 0;
        }

        .toolbar-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-sans);
            position: relative;
            flex-shrink: 0;
            letter-spacing: 0.2px;
        }

        .toolbar-btn:hover {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--border-light);
        }

        .toolbar-btn:active {
            transform: scale(0.92);
            background: var(--accent-soft-hover);
        }

        .toolbar-btn .icon-bold {
            font-weight: 800;
            font-size: 15px;
        }
        .toolbar-btn .icon-italic {
            font-style: italic;
            font-weight: 700;
            font-size: 15px;
            font-family: Georgia, serif;
        }
        .toolbar-btn .icon-strike {
            text-decoration: line-through;
            font-weight: 700;
            font-size: 14px;
        }
        .toolbar-btn .icon-h {
            font-weight: 800;
            font-size: 12px;
        }
        .toolbar-btn .icon-list {
            font-size: 13px;
        }
        .toolbar-btn .icon-code {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
        }
        .toolbar-btn .icon-quote {
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
        }
        .toolbar-btn .icon-hr {
            font-size: 16px;
            line-height: 1;
        }
        .toolbar-btn .icon-table {
            font-size: 13px;
        }
        .toolbar-btn .icon-link {
            font-size: 14px;
        }
        .toolbar-btn .icon-image {
            font-size: 14px;
        }

        /* Tooltip for toolbar buttons */
        .toolbar-btn[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2a45;
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            z-index: 100;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            pointer-events: none;
            letter-spacing: 0.3px;
            font-family: var(--font-sans);
        }

        /* ============ MAIN CONTENT ============ */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 0;
            min-height: 0;
            position: relative;
        }

        .editor-pane.hidden {
            display: none;
        }

        .editor-pane.preview-mode {
            display: none;
        }
        .editor-pane.preview-mode.active {
            display: flex;
        }

        .editor-pane.edit-mode {
            display: flex;
        }
        .editor-pane.edit-mode.active {
            display: flex;
        }

        /* Textarea */
        .markdown-textarea {
            flex: 1;
            width: 100%;
            background: var(--bg-input);
            color: var(--text-primary);
            border: none;
            outline: none;
            resize: none;
            padding: 24px 28px;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.7;
            letter-spacing: 0.2px;
            tab-size: 4;
            transition: all var(--transition);
            min-height: 0;
        }

        .markdown-textarea::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .markdown-textarea:focus {
            box-shadow: inset 0 0 0 1px var(--accent-soft);
        }

        .markdown-textarea::-webkit-scrollbar {
            width: 8px;
        }
        .markdown-textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        .markdown-textarea::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .markdown-textarea::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        /* Preview */
        .preview-pane {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-preview);
            padding: 28px 36px;
            transition: all var(--transition);
            min-height: 0;
            scroll-behavior: smooth;
        }

        .preview-pane::-webkit-scrollbar {
            width: 8px;
        }
        .preview-pane::-webkit-scrollbar-track {
            background: transparent;
        }
        .preview-pane::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .preview-pane::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        /* Markdown Preview Styles */
        .markdown-preview {
            max-width: 800px;
            margin: 0 auto;
            color: var(--text-preview);
            font-size: 15px;
            line-height: 1.75;
            font-family: var(--font-sans);
        }

        .markdown-preview h1,
        .markdown-preview h2,
        .markdown-preview h3,
        .markdown-preview h4,
        .markdown-preview h5,
        .markdown-preview h6 {
            color: var(--text-primary);
            font-weight: 700;
            margin-top: 28px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .markdown-preview h1 {
            font-size: 2em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .markdown-preview h2 {
            font-size: 1.5em;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 8px;
        }
        .markdown-preview h3 {
            font-size: 1.25em;
        }
        .markdown-preview h4 {
            font-size: 1.1em;
        }
        .markdown-preview h5,
        .markdown-preview h6 {
            font-size: 1em;
            color: var(--text-secondary);
        }

        .markdown-preview p {
            margin-bottom: 14px;
        }

        .markdown-preview a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent);
            transition: all var(--transition);
        }
        .markdown-preview a:hover {
            color: var(--accent-hover);
            border-bottom-color: var(--accent-hover);
        }

        .markdown-preview strong {
            font-weight: 700;
            color: var(--text-primary);
        }

        .markdown-preview em {
            font-style: italic;
        }

        .markdown-preview del {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .markdown-preview blockquote {
            border-left: 3px solid var(--accent);
            margin: 16px 0;
            padding: 12px 18px;
            background: var(--accent-soft);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        .markdown-preview blockquote p {
            margin-bottom: 0;
        }

        .markdown-preview ul,
        .markdown-preview ol {
            margin: 12px 0 16px 0;
            padding-left: 28px;
        }
        .markdown-preview ul li,
        .markdown-preview ol li {
            margin-bottom: 6px;
        }
        .markdown-preview ul ul,
        .markdown-preview ol ol,
        .markdown-preview ul ol,
        .markdown-preview ol ul {
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .markdown-preview code {
            background: var(--bg-code-inline);
            color: var(--accent);
            padding: 2px 7px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85em;
            letter-spacing: 0.2px;
        }

        .markdown-preview pre {
            background: var(--bg-code);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            overflow-x: auto;
            margin: 16px 0;
            box-shadow: var(--shadow-sm);
        }
        .markdown-preview pre code {
            background: transparent;
            color: var(--text-primary);
            padding: 0;
            border-radius: 0;
            font-size: 13px;
            line-height: 1.6;
            letter-spacing: 0.2px;
        }

        .markdown-preview pre::-webkit-scrollbar {
            height: 6px;
        }
        .markdown-preview pre::-webkit-scrollbar-track {
            background: transparent;
        }
        .markdown-preview pre::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .markdown-preview hr {
            border: none;
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        .markdown-preview img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            margin: 12px 0;
            display: block;
        }

        .markdown-preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
            font-size: 14px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .markdown-preview table th {
            background: var(--bg-surface);
            color: var(--text-primary);
            font-weight: 700;
            text-align: left;
            padding: 10px 14px;
            border: 1px solid var(--border);
        }
        .markdown-preview table td {
            padding: 10px 14px;
            border: 1px solid var(--border);
            color: var(--text-preview);
        }
        .markdown-preview table tr:nth-child(even) td {
            background: var(--bg-surface);
        }
        .markdown-preview table tr:hover td {
            background: var(--accent-soft);
        }

        .markdown-preview input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .markdown-preview mark {
            background: var(--warning);
            color: #000;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .markdown-preview abbr {
            text-decoration: underline dotted;
            cursor: help;
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 16px;
            user-select: none;
        }

        .empty-state .empty-icon {
            font-size: 56px;
            opacity: 0.4;
        }
        .empty-state .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .empty-state .empty-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 300px;
            line-height: 1.6;
        }

        /* ============ FOOTER ============ */
        .app-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            font-size: 11px;
            color: var(--text-muted);
            user-select: none;
        }

        .app-footer .shortcuts-hint {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-footer .shortcuts-hint span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .app-footer kbd {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* ============ ANIMATIONS ============ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-pane.active {
            animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .editor-pane.edit-mode.active {
            animation: fadeIn 0.25s ease;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .app-header {
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .app-title {
                font-size: 15px;
            }
            .stats-badge {
                font-size: 10px;
                padding: 4px 10px;
                gap: 8px;
            }
            .toolbar-container {
                padding: 6px 12px;
                gap: 0;
            }
            .toolbar-btn {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .toolbar-divider {
                height: 18px;
                margin: 0 3px;
            }
            .markdown-textarea {
                padding: 16px 18px;
                font-size: 13px;
            }
            .preview-pane {
                padding: 18px 20px;
            }
            .markdown-preview {
                font-size: 14px;
            }
            .app-footer {
                padding: 8px 16px;
                font-size: 10px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .btn {
                padding: 7px 12px;
                font-size: 12px;
            }
            .btn-sm {
                padding: 5px 10px;
                font-size: 11px;
            }
            .app-logo {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .app-header {
                padding: 8px 12px;
            }
            .stats-badge {
                display: none;
            }
            .toolbar-container {
                padding: 4px 8px;
            }
            .toolbar-btn {
                width: 26px;
                height: 26px;
                font-size: 11px;
                border-radius: 4px;
            }
            .toolbar-divider {
                height: 14px;
                margin: 0 2px;
            }
            .markdown-textarea {
                padding: 12px 14px;
                font-size: 12px;
            }
            .preview-pane {
                padding: 14px 16px;
            }
            .markdown-preview {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <!-- ============ HEADER ============ -->
    <header class="app-header">
        <div class="app-header-left">
            <div class="app-logo">M↓</div>
            <span class="app-title">Markdown <span>Editor Pro</span></span>
        </div>
        <div class="app-header-right">
            <div class="stats-badge" id="statsBadge">
                <span class="stat-item">📄 <strong id="wordCount">0</strong> parole</span>
                <span class="stats-separator"></span>
                <span class="stat-item">✏️ <strong id="charCount">0</strong> caratteri</span>
            </div>
            <button class="btn btn-sm btn-outline" id="btnExport" title="Scarica il file Markdown">
                📥 Esporta
            </button>
            <button class="btn btn-accent" id="btnToggleMode" title="Passa alla modalità Preview (Ctrl+E)">
                👁️ <span id="toggleModeText">Preview</span>
            </button>
        </div>
    </header>

    <!-- ============ TOOLBAR ============ -->
    <div class="toolbar-container" id="toolbarContainer">
        <!-- Gruppo: Stile testo -->
        <div class="toolbar-group">
            <button class="toolbar-btn" data-tooltip="Grassetto (Ctrl+B)" data-action="bold" title="Grassetto">
                <span class="icon-bold">B</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Corsivo (Ctrl+I)" data-action="italic" title="Corsivo">
                <span class="icon-italic">I</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Barrato" data-action="strike" title="Barrato">
                <span class="icon-strike">S</span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Gruppo: Intestazioni -->
        <div class="toolbar-group">
            <button class="toolbar-btn" data-tooltip="Titolo 1" data-action="h1" title="H1">
                <span class="icon-h">H1</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Titolo 2" data-action="h2" title="H2">
                <span class="icon-h">H2</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Titolo 3" data-action="h3" title="H3">
                <span class="icon-h">H3</span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Gruppo: Liste -->
        <div class="toolbar-group">
            <button class="toolbar-btn" data-tooltip="Lista puntata" data-action="ul" title="Lista puntata">
                <span class="icon-list">•≡</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Lista numerata" data-action="ol" title="Lista numerata">
                <span class="icon-list">1≡</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Task list" data-action="task" title="Task list">
                <span class="icon-list">☑≡</span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Gruppo: Link e Media -->
        <div class="toolbar-group">
            <button class="toolbar-btn" data-tooltip="Inserisci link (Ctrl+K)" data-action="link" title="Link">
                <span class="icon-link">🔗</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Inserisci immagine" data-action="image" title="Immagine">
                <span class="icon-image">🖼️</span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Gruppo: Codice -->
        <div class="toolbar-group">
            <button class="toolbar-btn" data-tooltip="Codice inline" data-action="code-inline" title="Codice inline">
                <span class="icon-code">&lt;/&gt;</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Blocco codice" data-action="code-block" title="Blocco codice">
                <span class="icon-code">{ }</span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Gruppo: Altro -->
        <div class="toolbar-group">
            <button class="toolbar-btn" data-tooltip="Citazione" data-action="quote" title="Citazione">
                <span class="icon-quote">❝</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Linea orizzontale" data-action="hr" title="Linea orizzontale">
                <span class="icon-hr">—</span>
            </button>
            <button class="toolbar-btn" data-tooltip="Tabella" data-action="table" title="Tabella">
                <span class="icon-table">⊞</span>
            </button>
        </div>
    </div>

    <!-- ============ MAIN CONTENT ============ -->
    <div class="main-content">
        <!-- Pannello Editor -->
        <div class="editor-pane edit-mode active" id="editorPane">
            <textarea
            class="markdown-textarea"
            id="markdownInput"
            placeholder="Scrivi il tuo documento in Markdown qui...&#10;&#10;Suggerimenti:&#10;# Titolo principale&#10;## Sottotitolo&#10;**testo in grassetto**&#10;*testo in corsivo*&#10;[Link](https://esempio.com)&#10;```codice```&#10;> Citazione"
            spellcheck="false"
        ></textarea>
        </div>

        <!-- Pannello Preview -->
        <div class="editor-pane preview-mode" id="previewPane">
            <div class="preview-pane" id="previewScroll">
                <div class="markdown-preview" id="previewContent">
                    <div class="empty-state" id="emptyPreview">
                        <div class="empty-icon">📖</div>
                        <div class="empty-title">Nessun contenuto</div>
                        <div class="empty-subtitle">Scrivi del testo Markdown nell'editor e premi "Preview" per vedere il risultato formattato.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ FOOTER ============ -->
    <footer class="app-footer">
        <span>💡 Supporta sintassi Markdown completa</span>
        <div class="shortcuts-hint">
            <span><kbd>Ctrl</kbd>+<kbd>E</kbd> Anteprima</span>
            <span><kbd>Ctrl</kbd>+<kbd>B</kbd> Grassetto</span>
            <span><kbd>Ctrl</kbd>+<kbd>I</kbd> Corsivo</span>
            <span><kbd>Ctrl</kbd>+<kbd>K</kbd> Link</span>
        </div>
    </footer>

    <script>
        (function() {
            // ============ ELEMENTI DOM ============
            const textarea = document.getElementById('markdownInput');
            const previewContent = document.getElementById('previewContent');
            const emptyPreview = document.getElementById('emptyPreview');
            const editorPane = document.getElementById('editorPane');
            const previewPane = document.getElementById('previewPane');
            const previewScroll = document.getElementById('previewScroll');
            const toolbarContainer = document.getElementById('toolbarContainer');
            const btnToggleMode = document.getElementById('btnToggleMode');
            const toggleModeText = document.getElementById('toggleModeText');
            const btnExport = document.getElementById('btnExport');
            const wordCountEl = document.getElementById('wordCount');
            const charCountEl = document.getElementById('charCount');

            // ============ STATO ============
            let isPreviewMode = false;
            let lastPreviewContent = '';

            // ============ CONFIGURAZIONE MARKED ============
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    gfm: true,
                    breaks: true,
                    headerIds: true,
                    mangle: false,
                    pedantic: false,
                    sanitize: false,
                    smartLists: true,
                    smartypants: true,
                    highlight: function(code, lang) {
                        if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                            try {
                                return hljs.highlight(code, { language: lang }).value;
                            } catch (e) {
                                // fallback
                            }
                        }
                        if (typeof hljs !== 'undefined') {
                            try {
                                return hljs.highlightAuto(code).value;
                            } catch (e) {
                                return code;
                            }
                        }
                        return code;
                    }
                });
            }

            // ============ FUNZIONI UTILITÀ ============
            function updateStats() {
                const text = textarea.value;
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                const chars = text.length;
                wordCountEl.textContent = words;
                charCountEl.textContent = chars;
            }

            function getSelectedText() {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                return {
                    text: textarea.value.substring(start, end),
                    start: start,
                    end: end
                };
            }

            function replaceSelection(newText, cursorOffsetStart, cursorOffsetEnd) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const beforeText = textarea.value.substring(0, start);
                const afterText = textarea.value.substring(end);
                textarea.value = beforeText + newText + afterText;
                const newCursorStart = start + (cursorOffsetStart !== undefined ? cursorOffsetStart : 0);
                const newCursorEnd = start + (cursorOffsetEnd !== undefined ? cursorOffsetEnd : newText.length);
                textarea.focus();
                textarea.setSelectionRange(newCursorStart, newCursorEnd);
                updateStats();
            }

            function wrapSelection(before, after, placeholder) {
                const sel = getSelectedText();
                if (sel.text) {
                    replaceSelection(before + sel.text + after, before.length + sel.text.length + after.length, before
                        .length + sel.text.length + after.length);
                } else {
                    const ph = placeholder || 'testo';
                    replaceSelection(before + ph + after, before.length + ph.length, before.length + ph.length);
                }
            }

            function insertAtCursor(text, cursorOffset) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const beforeText = textarea.value.substring(0, start);
                const afterText = textarea.value.substring(end);
                textarea.value = beforeText + text + afterText;
                const newPos = start + (cursorOffset !== undefined ? cursorOffset : text.length);
                textarea.focus();
                textarea.setSelectionRange(newPos, newPos);
                updateStats();
            }

            function insertLinePrefix(prefix, placeholder) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const lineStart = textarea.value.lastIndexOf('\n', start - 1) + 1;
                const lineEnd = textarea.value.indexOf('\n', end);
                const actualLineEnd = lineEnd === -1 ? textarea.value.length : lineEnd;
                const currentLine = textarea.value.substring(lineStart, actualLineEnd);
                const selText = textarea.value.substring(start, end);
                const ph = placeholder || 'elemento';
                const newContent = prefix + (selText || ph);
                textarea.value = textarea.value.substring(0, lineStart) + newContent + textarea.value.substring(
                    actualLineEnd);
                const newCursorPos = lineStart + newContent.length;
                textarea.focus();
                textarea.setSelectionRange(newCursorPos, newCursorPos);
                updateStats();
            }

            // ============ AZIONI TOOLBAR ============
            const actions = {
                'bold': function() {
                    wrapSelection('**', '**', 'testo in grassetto');
                },
                'italic': function() {
                    wrapSelection('*', '*', 'testo in corsivo');
                },
                'strike': function() {
                    wrapSelection('~~', '~~', 'testo barrato');
                },
                'h1': function() {
                    insertLinePrefix('# ', 'Titolo 1');
                },
                'h2': function() {
                    insertLinePrefix('## ', 'Titolo 2');
                },
                'h3': function() {
                    insertLinePrefix('### ', 'Titolo 3');
                },
                'ul': function() {
                    insertLinePrefix('- ', 'voce elenco');
                },
                'ol': function() {
                    insertLinePrefix('1. ', 'voce elenco');
                },
                'task': function() {
                    insertLinePrefix('- [ ] ', 'attività');
                },
                'link': function() {
                    const sel = getSelectedText();
                    if (sel.text) {
                        replaceSelection('[' + sel.text + '](url)', sel.text.length + 3, sel.text.length + 3);
                    } else {
                        const template = '[testo link](https://esempio.com)';
                        insertAtCursor(template, 1);
                        textarea.setSelectionRange(textarea.selectionStart + 1, textarea.selectionStart + 11);
                    }
                },
                'image': function() {
                    const template = '![descrizione](url-immagine)';
                    insertAtCursor(template, 2);
                    textarea.setSelectionRange(textarea.selectionStart + 2, textarea.selectionStart + 13);
                },
                'code-inline': function() {
                    wrapSelection('`', '`', 'codice');
                },
                'code-block': function() {
                    const sel = getSelectedText();
                    if (sel.text) {
                        replaceSelection('```\n' + sel.text + '\n```', 4 + sel.text.length + 4, 4 + sel.text.length + 4);
                    } else {
                        const template = '```\nscrivi il tuo codice qui...\n```';
                        insertAtCursor(template, 4);
                        textarea.setSelectionRange(textarea.selectionStart + 4, textarea.selectionStart + 24);
                    }
                },
                'quote': function() {
                    insertLinePrefix('> ', 'citazione');
                },
                'hr': function() {
                    insertAtCursor('\n---\n', 5);
                },
                'table': function() {
                    const template =
                        '\n| Colonna 1 | Colonna 2 | Colonna 3 |\n|----------|----------|----------|\n| Dato 1   | Dato 2   | Dato 3   |\n| Dato 4   | Dato 5   | Dato 6   |\n';
                    insertAtCursor(template, template.length);
                }
            };

            // ============ TOOLBAR EVENT LISTENERS ============
            toolbarContainer.addEventListener('click', function(e) {
                const btn = e.target.closest('.toolbar-btn');
                if (!btn) return;
                const action = btn.getAttribute('data-action');
                if (action && actions[action]) {
                    actions[action]();
                    textarea.focus();
                    if (isPreviewMode) {
                        // Se siamo in preview, torna all'editor
                        toggleMode();
                    }
                }
            });

            // ============ MODALITÀ PREVIEW / EDITOR ============
            function toggleMode() {
                isPreviewMode = !isPreviewMode;
                if (isPreviewMode) {
                    // Vai alla preview
                    renderPreview();
                    editorPane.classList.remove('active');
                    previewPane.classList.add('active');
                    toggleModeText.textContent = 'Modifica';
                    btnToggleMode.innerHTML = '✏️ <span id="toggleModeText">Modifica</span>';
                    toolbarContainer.style.opacity = '0';
                    toolbarContainer.style.pointerEvents = 'none';
                    toolbarContainer.style.height = '0';
                    toolbarContainer.style.padding = '0';
                    toolbarContainer.style.borderBottom = 'none';
                    previewScroll.scrollTop = 0;
                } else {
                    // Torna all'editor
                    editorPane.classList.add('active');
                    previewPane.classList.remove('active');
                    toggleModeText.textContent = 'Preview';
                    btnToggleMode.innerHTML = '👁️ <span id="toggleModeText">Preview</span>';
                    toolbarContainer.style.opacity = '1';
                    toolbarContainer.style.pointerEvents = 'auto';
                    toolbarContainer.style.height = 'auto';
                    toolbarContainer.style.padding = '8px 20px';
                    toolbarContainer.style.borderBottom = '1px solid var(--border)';
                    textarea.focus();
                }
            }

            function renderPreview() {
                const markdownText = textarea.value.trim();
                if (!markdownText) {
                    previewContent.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📖</div>
                            <div class="empty-title">Nessun contenuto</div>
                            <div class="empty-subtitle">Scrivi del testo Markdown nell'editor e premi "Preview" per vedere il risultato formattato.</div>
                        </div>
                    `;
                    lastPreviewContent = '';
                    return;
                }

                try {
                    let html = '';
                    if (typeof marked !== 'undefined') {
                        html = marked.parse(markdownText);
                    } else {
                        // Fallback basico se marked non è caricato
                        html = escapeHtml(markdownText).replace(/\n/g, '<br>');
                    }
                    previewContent.innerHTML = html;
                    lastPreviewContent = markdownText;

                    // Applica highlight.js ai blocchi di codice
                    if (typeof hljs !== 'undefined') {
                        previewContent.querySelectorAll('pre code').forEach((block) => {
                            try {
                                hljs.highlightElement(block);
                            } catch (e) {
                                // ignore
                            }
                        });
                    }

                    // Rendi i link aperti in una nuova scheda
                    previewContent.querySelectorAll('a').forEach(link => {
                        link.setAttribute('target', '_blank');
                        link.setAttribute('rel', 'noopener noreferrer');
                    });

                } catch (e) {
                    previewContent.innerHTML =
                        '<p style="color: #f44336;">Errore nel parsing del Markdown. Verifica la sintassi.</p>';
                    console.error('Markdown parsing error:', e);
                }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============ EVENT LISTENERS ============
            btnToggleMode.addEventListener('click', toggleMode);

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                const ctrlPressed = e.ctrlKey || e.metaKey;

                // Ctrl+E: Toggle preview
                if (ctrlPressed && e.key === 'e') {
                    e.preventDefault();
                    toggleMode();
                    return;
                }

                // Ctrl+B: Bold
                if (ctrlPressed && e.key === 'b' && !isPreviewMode) {
                    e.preventDefault();
                    actions['bold']();
                    return;
                }

                // Ctrl+I: Italic
                if (ctrlPressed && e.key === 'i' && !isPreviewMode) {
                    e.preventDefault();
                    actions['italic']();
                    return;
                }

                // Ctrl+K: Link
                if (ctrlPressed && e.key === 'k' && !isPreviewMode) {
                    e.preventDefault();
                    actions['link']();
                    return;
                }

                // Ctrl+S: Export (salva il file)
                if (ctrlPressed && e.key === 's') {
                    e.preventDefault();
                    exportMarkdown();
                    return;
                }
            });

            // Aggiorna statistiche quando si digita
            textarea.addEventListener('input', updateStats);

            // Tab key support in textarea (insert 4 spaces)
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Tab' && !isPreviewMode) {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    const spaces = '    ';
                    this.value = this.value.substring(0, start) + spaces + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + spaces.length;
                    updateStats();
                }
            });

            // ============ ESPORTA MARKDOWN ============
            function exportMarkdown() {
                const markdownText = textarea.value;
                if (!markdownText.trim()) {
                    alert('Il documento è vuoto. Scrivi prima del testo Markdown.');
                    return;
                }
                const blob = new Blob([markdownText], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'documento.md';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            btnExport.addEventListener('click', exportMarkdown);

            // ============ INIZIALIZZAZIONE ============
            updateStats();

            // Esempio di testo iniziale per dimostrare
            const demoText = `# Benvenuto in Markdown Editor Pro ✨

Questa è una **demo** del tuo nuovo editor Markdown. Scopri quanto è facile formattare il testo!

## Funzionalità principali

- **Grassetto** con \`**testo**\`
- *Corsivo* con \`*testo*\`
- ~~Barrato~~ con \`~~testo~~\`
- [Link cliccabili](https://esempio.com)
- \`Codice inline\` con backtick

### Blocco di codice

\`\`\`javascript
function saluta(nome) {
    console.log(\`Ciao, \${nome}!\`);
}

saluta('Mondo');
\`\`\`

### Citazione

> Il miglior momento per piantare un albero era vent'anni fa.
> Il secondo miglior momento è adesso.
> — *Proverbio cinese*

### Tabella

| Funzionalità | Stato | Priorità |
|-------------|-------|----------|
| Editor Markdown | ✅ Completata | Alta |
| Modalità Preview | ✅ Completata | Alta |
| Esportazione file | ✅ Completata | Media |
| Collaborazione | 🚧 In sviluppo | Bassa |

---

### Lista attività

- [x] Scaricare l'editor
- [x] Testare la modalità preview
- [ ] Scrivere un documento
- [ ] Condividere con il team

---

**Suggerimento:** Premi \`Ctrl+E\` per passare tra editor e preview, oppure usa il pulsante in alto a destra.

*Buona scrittura!* 🚀`;

            textarea.value = demoText;
            updateStats();

            console.log('🚀 Markdown Editor Pro inizializzato con successo!');
            console.log('📝 Premi Ctrl+E per vedere la preview');
            console.log('💡 Usa la toolbar per formattare rapidamente il testo');
        })();
    </script>
</body>
</html>
